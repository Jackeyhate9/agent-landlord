# Agent Landlord backend — single service, pure SQLite (no GPU, no postgres/redis).
# The single API process owns the game engine, agent gateway, queue, ledger and the
# in-process broadcast delay, which avoids split-brain state on one table in the MVP.
services:
  api:
    build: .
    command: ["uvicorn", "server.app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      APP_ENV: production
      SQLITE_PATH: /app/data/arena.db
      AVATAR_DIR: /app/data/avatars
      # postgres/redis intentionally left empty → Store falls back to SQLite, broadcast runs in-process
      POSTGRES_URL: ""
      REDIS_URL: ""
      INITIAL_ARENA_TOKENS: "10000"
      MAX_MULTIPLIER: "8"
      MAX_TABLE_WIN_STREAK: "10"
      AGENT_DECISION_TIMEOUT_MS: "8000"
      BROADCAST_DELAY_SECONDS: "30"
      # PUBLIC_API_URL is the public tunnel host; the app also serves /join commands from origin.
      PUBLIC_API_URL: "https://api.thbianhua.cn"
      PUBLIC_WS_URL: "wss://api.thbianhua.cn"
    ports:
      - "8080:8080"
    volumes:
      - arena-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    # No GPU reservation: this backend is CPU-only. Do NOT add `gpus:` here.
    deploy:
      resources:
        reservations:
          devices: []

volumes:
  arena-data:
