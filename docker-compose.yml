services:
  api:
    build: .
    command: ["uvicorn", "server.app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      SQLITE_PATH: /app/data/arena.db
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://arena:arena@postgres:5432/arena
    ports: ["8080:8080"]
    volumes: ["arena-data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # The authoritative game engine and Agent Gateway are modules of the API process;
  # keeping one writer avoids split-brain table state in the single-table MVP.
  broadcast-worker:
    build: .
    command: ["python", "-m", "server.app.broadcast_worker"]
    env_file: .env
    environment:
      SQLITE_PATH: /app/data/arena.db
      REDIS_URL: redis://redis:6379/0
    volumes: ["arena-data:/app/data"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  arena-data:
  postgres-data:
  redis-data:

